---
name: Deploy to S3

# yamllint disable rule:truthy
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to S3
        run: |
          aws s3 cp frontend/index.html s3://lj-train-spotting/index.html
          aws s3 cp frontend/script.js s3://lj-train-spotting/script.js
          aws s3 cp frontend/style.css s3://lj-train-spotting/style.css
          aws s3 sync frontend/assets/ s3://lj-bracket-clash/assets/ --delete
